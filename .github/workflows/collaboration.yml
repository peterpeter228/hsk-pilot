name: Collaboration protocol
on:
  pull_request:
    paths:
      - 'coordination/**'
      - 'AGENTS.md'
      - 'TASKS.md'
      - 'tasks/**'
      - 'docs/**'
      - 'scripts/validate-collaboration.mjs'
      - 'tests/collaboration-protocol.test.mjs'
      - '.github/workflows/collaboration.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: node scripts/validate-collaboration.mjs coordination/handoff.json
      - run: node --test tests/collaboration-protocol.test.mjs
