[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["../node_modules"]
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
[fuzz]
runs = 256
[invariant]
runs = 64
depth = 32
fail_on_revert = false

# Explicit opt-in only. Public RPC is used for reads; all calls/state changes run locally.
[profile.fork]
test = "fork"
